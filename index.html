<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4f46e5" />
    <meta
      name="description"
      content="Messenger Analytics — Telegram va Instagram savdo suhbatlarini AI bilan tahlil qiluvchi platforma."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..800&display=swap"
      rel="stylesheet"
    />
    <title>Messenger Analytics</title>

    <!--
      Applies the stored theme before first paint. Without this the page renders
      light for a frame and then flips, which is far more jarring than the few
      lines of inline script it costs.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('ma.theme') || 'system'
          var dark =
            stored === 'dark' ||
            (stored === 'system' &&
              matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
